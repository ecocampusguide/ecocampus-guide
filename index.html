<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCampus Guide | Institutional Sustainability Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eco: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; }
        .eco-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        
        .nav-link { 
            font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #64748b; 
            transition: all 0.2s ease; padding: 8px 16px; border-radius: 99px;
            display: inline-flex; align-items: center; cursor: pointer;
        }
        .nav-link:hover { color: #059669; background-color: #f8fafc; }
        .nav-link.active { color: #059669; background-color: #dcfce7; }

        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .bg-overlay { background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.65) 100%); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
        .calendar-cell { 
            min-height: 76px; border-radius: 16px; padding: 8px; transition: all 0.2s ease; 
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
            border: 1.5px solid #f1f5f9; background: #ffffff;
        }
        .calendar-cell:hover { border-color: #10b981; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.08); }
        .calendar-cell.selected { border-color: #059669; background-color: #f0fdf4; }
        .calendar-cell.empty { background: transparent; border-color: transparent; cursor: default; }
        .calendar-cell.empty:hover { transform: none; box-shadow: none; }
    </style>
</head>

                    <i data-lucide="leaf" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900">EcoCampus Guide</h1>
                <p class="text-slate-500 text-xs font-medium mt-1">Institutional Sustainability Intelligence</p>
            </div>

            <div x-show="pendingVerification" class="space-y-6 text-center">
